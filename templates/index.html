<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>source-first search engine</title>
    <style>
        :root {
            --bg: #c5c5ea;
            --surface: #d8c993;
            --text: #2b2b2b;
            --text-muted: #525257;
            --accent: #4caf50;
            --border: #29292e;
        }
        body {
            font-family: "Times New Roman", Times, serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 720px;
        }
        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: -0.05em; }
        .subtitle { color: var(--text-muted); margin-bottom: 2rem; font-size: 1rem; }
        form { display: flex; width: 100%; gap: 10px; margin-bottom: 2rem; }
        input[type="text"] {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .source-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }
        .source-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 0.5rem; color: #fff; }
        .source-url { font-size: 0.85rem; color: var(--accent); word-break: break-all; margin-bottom: 1rem; }
        .source-content { color: var(--text-muted); line-height: 1.6; font-size: 1rem; }
        .metrics { font-size: 0.75rem; color: var(--text-muted); background: var(--bg); padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; border: 1px solid var(--border); }
    </style>
</head>
<body>
    <div class="container">
        <h1>source-first search engine</h1>

        <form action="/" method="GET">
            <input type="text" name="q" value="{{.Query}}" placeholder="Enter your deep or conversational question..." required autocomplete="off">
            <button type="submit">Search</button>
        </form>

        {{if .Query}}
            <h2>Top Verified Sources</h2>
            {{range .Results}}
                <div class="source-card">
                    <div class="metrics">Density Score: {{printf "%.4f" .DensityScore}}</div>
                    <div class="source-title">{{.Title}}</div>
                    <div class="source-url">{{.URL}}</div>
                    <div class="source-content">{{.Content}}</div>
                </div>
            {{else}}
                <p style="color: var(--text-muted);">No raw high-density files matched your query signature.</p>
            {{end}}
        {{end}}
    </div>
</body>
</html>
